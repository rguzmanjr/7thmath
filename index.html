<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Numlings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&family=Sniglet:wght@400;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app" aria-live="off"></div>
<nav class="nav" id="nav" hidden aria-label="Main"></nav>
<div id="modal-root"></div>
<script>
/* After you upload changed files, raise VERSION by 1 so every browser grabs the new copies instead of old cached ones. */
const VERSION = 6;
/* The game files, in the order they must load. Add new files to this list. */
const FILES = [
  'js/config.js',
  'js/util.js', 'js/i18n.js',
  'data/zones.js',
  'data/species.js',
  'js/art-vector.js',
  'js/art-pixel.js',
  'data/questions.js',
  'js/state.js',
  'js/popup.js',
  'data/maps.js',
  'data/quests.js',
  'js/map.js',
  'js/quests.js',
  'js/sprites.js',
  'js/dungeon.js',
  'js/screens.js',
  'js/encounter.js',
  'js/battle.js',
  'js/team.js',
  'js/trial.js',
  'js/savepage.js',
  'js/main.js'
];
for (const f of FILES) { const s = document.createElement('script'); s.src = f + '?v=' + VERSION; s.async = false; document.body.appendChild(s); }
document.querySelector('link[href^="css/style.css"]').href = 'css/style.css?v=' + VERSION;
</script>
</body>
</html>
