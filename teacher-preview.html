<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Question preview · Math 7 Arcade</title>
<style>
body{background:#0E1016;color:#F3F5FA;font:500 15px/1.4 Lexend,Inter,system-ui,sans-serif;margin:0;padding:20px}
h1{font:800 28px/1.1 system-ui;margin:0 0 4px} p.s{color:#9AA3B8;margin:0 0 16px}
select,button{font:700 15px system-ui;background:#222634;color:#F3F5FA;border:2px solid #2E3344;border-radius:10px;padding:8px 12px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-top:14px}
.c{background:#191C25;border:1px solid #2E3344;border-radius:12px;padding:12px}
.pv-graph{width:100%;max-width:300px;height:auto;aspect-ratio:1;background:#12151D;border-radius:12px;display:block;margin:6px 0}
.pv-fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.78em;line-height:1.05;margin:0 .08em}
.pv-fr span:first-child{border-bottom:.08em solid currentColor;padding:0 .12em}
.c-ans{color:#D9A6FF;font-weight:800}.c-m{color:#FFC82E}
.tag{font:700 12px system-ui;color:#FFB020;text-transform:uppercase;letter-spacing:.08em}
ul{margin:6px 0 0;padding-left:18px} li.ok{color:#7CE04A;font-weight:700} li small{color:#9AA3B8} .ex{color:#C9D1E0;margin-top:6px;font-size:14px}
</style></head><body>
<h1>Question preview</h1><p class="s">Teacher page. Every click makes new questions, with answers and the feedback students see.</p>
<select id="set"></select> <button id="go">New questions</button>
<div class="g" id="g"></div>
<script src="questions.js"></script><script>
var S=SpitzQ.sets, sel=document.getElementById('set');
sel.innerHTML=Object.keys(S).map(function(id){ return '<option value="'+id+'">'+S[id].name+' (TEKS '+S[id].teks+')</option>'; }).join('');
function draw(){ var id=sel.value, Q=S[id].make('pv'), h='';
  S[id].topics.forEach(function(t){ t[2].forEach(function(g){ for(var i=0;i<2;i++){ var q=Q.build(g);
    h+='<div class="c"><div class="tag">'+t[1]+'</div><div>'+q.prompt+'</div>'+q.visual+'<ul>'+q.choices.map(function(c){ return '<li class="'+(c.ok?'ok':'')+'">'+c.html+(c.ok?' ✔':' <small>— '+c.why+'</small>')+'</li>'; }).join('')+'</ul><div class="ex">'+q.explain+'</div></div>'; } }); });
  document.getElementById('g').innerHTML=h; }
sel.onchange=draw; document.getElementById('go').onclick=draw; draw();
</script></body></html>
