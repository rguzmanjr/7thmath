<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Numlings: teacher dashboard</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&family=Sniglet:wght@400;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/teacher.css">
</head>
<body class="teacher">
<header class="t-head"><h1>Numlings <span>Teacher dashboard</span></h1>
  <p class="muted">See which TEKS skills your students have mastered, who needs help, and who to group for reteaching.</p></header>
<main id="t-app"></main>
<script>
/* Keep VERSION in step with index.html so browsers load fresh files after an update. */
const VERSION = 6;
const FILES = ['js/config.js', 'js/util.js', 'js/i18n.js', 'data/zones.js', 'data/species.js', 'data/questions.js', 'js/state.js', 'data/maps.js', 'data/quests.js', 'js/teacher.js'];
for (const f of FILES) { const s = document.createElement('script'); s.src = f + '?v=' + VERSION; s.async = false; document.body.appendChild(s); }
for (const l of document.querySelectorAll('link[href^="css/"]')) l.href = l.getAttribute('href') + '?v=' + VERSION;
</script>
</body>
</html>
